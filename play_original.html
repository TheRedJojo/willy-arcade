<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender | RetroLab Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container header-content">
        <a href="./index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">🕹️</span>
            <span>RetroLab <span class="text-cyan">Arcade</span></span>
        </a>
        <nav class="main-nav" aria-label="Navigazione principale">
            <a href="./index.html" class="nav-link">Catalogo</a>
            <a href="./play_original.html" class="nav-link active">Giochi Originali</a>
            <a href="./play_retro.html" class="nav-link">Retro Emulator</a>
        </nav>
    </div>
</header>

<main class="container main-content">
    <div class="game-stage-wrapper">
        <div class="hud-bar" role="status" aria-live="polite">
            <div class="hud-item">SCORE: <span id="hud-score">0</span></div>
            <div class="hud-item">BEST: <span id="hud-best">0</span></div>
            <div class="hud-item">WAVE: <span id="hud-wave">1</span></div>
            <div class="hud-item">LIVES: <span id="hud-lives">3</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="game-canvas" width="820" height="500" aria-label="Area di gioco Space Defender"></canvas>
        </div>

        <div class="touch-pad" aria-label="Controlli di gioco">
            <div class="dpad-group">
                <button type="button" id="pad-left" class="pad-btn" aria-label="Muovi a sinistra">◀</button>
                <button type="button" id="pad-right" class="pad-btn" aria-label="Muovi a destra">▶</button>
            </div>
            <div class="action-pad-group">
                <button type="button" id="pad-pause" class="pad-btn" aria-label="Pausa">⏸</button>
                <button type="button" id="pad-fire" class="pad-btn pad-btn-fire" aria-label="Spara">FUOCO</button>
            </div>
        </div>

        <div class="controls-bar">
            <div class="crypto-status" id="game-save-status">
                Tastiera: <strong>Frecce / A-D</strong> (movimento) • <strong>Spazio / Z</strong> (fuoco) • <strong>P</strong> (pausa) • <strong>R</strong> (riavvia)
            </div>
            <div class="storage-buttons">
                <button type="button" id="btn-restart-game" class="btn btn-primary btn-sm">Nuova Partita</button>
                <a href="./index.html" class="btn btn-outline btn-sm">Catalogo</a>
            </div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-content">
        <p>Space Defender — HTML5 Canvas + Web Audio API.</p>
        <p class="footer-note">I record vengono salvati in localStorage con verifica SHA-256.</p>
    </div>
</footer>

<script src="./assets/js/storage_crypto.js"></script>
<script src="./assets/js/space_game.js"></script>
</body>
</html>
